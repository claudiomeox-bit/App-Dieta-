<title>Piano alimentare – si aggiorna ogni giorno</title>
<style>
:root{--bg:#F2F6F0;--card:#fff;--ink:#1D2B26;--mute:#566660;--line:#D5DFD6;--acc:#2F6B4F;--tom:#C23B26;--alt:#FFF1D6;--plate:#fff;--tintp:#E3EDE2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#121A16;--card:#1B2620;--ink:#E8EFEA;--mute:#A3B3AA;--line:#2E3C34;--acc:#7CC39F;--tom:#F07A64;--alt:#3A3220;--plate:#EEF0E8;--tintp:#24332B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 Figtree,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 18px 56px}
h1{font:700 clamp(26px,5vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
nav button{flex:0 0 auto;min-height:48px;font:600 16px Figtree,sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:0 18px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#wk button{border-radius:10px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
h2{font:700 28px/1.2 Fraunces,Georgia,serif;margin:10px 0 14px}
section.m.now{border:2px solid var(--acc)}
.nowb{background:var(--acc);color:var(--bg);font:600 12px Figtree,sans-serif;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:middle}
section.m{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:start}
.pic svg{width:116px;height:116px;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.pic{background:var(--tintp);border-radius:16px;padding:0}
@media (max-width:520px){section.m{grid-template-columns:1fr}.pic{justify-self:center}}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{font:600 21px Fraunces,Georgia,serif;margin:0}
label.done{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute);min-height:44px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
ul{margin:8px 0;padding-left:22px}
li{margin:3px 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;color:var(--acc)}
details p{margin:0 0 6px}
.alt{background:var(--alt);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:16px}
.alt b{display:block;margin-bottom:2px}
.olio{color:var(--tom);font-weight:600;font-size:15px;margin:6px 0 0}
.note{color:var(--mute);font-size:16px}

nav button.add{border-style:dashed;color:var(--acc)}
textarea{width:100%;font:15px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.row button,.fb,.dl button{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 16px Figtree,system-ui,sans-serif;display:inline-flex;align-items:center;cursor:pointer}
.fb.pri,.row button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.dl{display:flex;gap:8px;align-items:center;margin:6px 0}.dl span{flex:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.top h1{flex:1;min-width:0}
.cal{flex:0 0 auto;width:66px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 8px rgba(0,0,0,.2);overflow:hidden;text-align:center;position:relative;font-family:Figtree,system-ui,sans-serif;line-height:1}
.cal::before,.cal::after{content:"";position:absolute;top:4px;width:6px;height:6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.cal::before{left:14px}.cal::after{right:14px}
.cal b{display:block;background:#C23B26;color:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 0 5px}
.cal strong{display:block;font:700 30px/1 Fraunces,Georgia,serif;padding:7px 0 3px;color:var(--ink)}
.cal em{display:block;font-style:normal;font-size:12px;color:var(--mute);padding-bottom:7px;text-transform:capitalize}
</style>
</head>
